# Builds Lumi on every push, so the app always matches the code on GitHub.
# The signing key comes from encrypted GitHub secrets (never from a file in this repo):
#   LUMI_KEYSTORE_BASE64, LUMI_STORE_PASSWORD, LUMI_KEY_ALIAS, LUMI_KEY_PASSWORD
# Each new version (versionName in app/build.gradle.kts) also gets a signed GitHub Release,
# which Obtainium on Mom's tablet picks up.
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the signing key in place (from encrypted secrets)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUMI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Signing key secrets aren't set up. This build is UNSIGNED and won't update Mom's copy."
            echo "suffix=-UNSIGNED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > app/lumi.keystore 2>/dev/null; then
            echo "::error::LUMI_KEYSTORE_BASE64 isn't valid key text. Re-copy it with the PowerShell command and paste it again."
            exit 1
          fi
          if ! keytool -list -keystore app/lumi.keystore -storepass "$STORE_PASSWORD" -alias "${KEY_ALIAS:-lumi}" > /dev/null 2>&1; then
            echo "::error::The key file decoded, but the password or alias doesn't match. Check LUMI_STORE_PASSWORD and LUMI_KEY_ALIAS."
            exit 1
          fi
          {
            echo "storeFile=lumi.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-lumi}"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties
          echo "suffix=" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the app file
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHORT=${GITHUB_SHA::7}
          NAME="Lumi-${VERSION}-${SHORT}${{ steps.key.outputs.suffix }}"
          mv app/build/outputs/apk/debug/app-debug.apk "$NAME.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish a Release (signed builds only, once per version)
        if: steps.key.outputs.suffix == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          FILE="${{ steps.name.outputs.name }}.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish another."
            exit 0
          fi
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "Lumi $VERSION" \
            --notes "Install: open this on the tablet, tap the .apk, then Install. Built from commit ${GITHUB_SHA::7}. Status: https://github.com/${GITHUB_REPOSITORY}/blob/main/STATUS.md"

      - name: Clean up the key
        if: always()
        run: rm -f app/lumi.keystore app/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          retention-days: 30
